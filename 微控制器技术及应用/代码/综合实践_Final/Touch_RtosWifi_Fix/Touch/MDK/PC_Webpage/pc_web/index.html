<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STM32 工作状态监控</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif; max-width:860px; margin:24px auto; padding:0 16px;}
    .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
    input{padding:10px 12px; font-size:16px; width:260px;}
    button{padding:10px 14px; font-size:16px; cursor:pointer;}
    .card{border:1px solid #ddd; border-radius:10px; padding:14px 16px; margin-top:14px;}
    .kv{display:flex; gap:16px; flex-wrap:wrap;}
    .k{color:#666; min-width:120px;}
    .v{font-weight:700;}
    #dot{display:inline-block; width:10px; height:10px; border-radius:50%; background:#aaa; margin-right:8px;}
    #log{white-space:pre; background:#0b0f14; color:#d1e7ff; padding:12px; border-radius:10px; overflow:auto; max-height:220px;}
    canvas{width:100%; height:240px; border:1px solid #ddd; border-radius:10px;}
    small{color:#666;}
  </style>
</head>
<body>
  <h2>STM32 工作状态监控（同一热点下使用）</h2>
  <div class="row">
    <div>
      <div><small>开发板 IP（示例：192.168.43.123）</small></div>
      <input id="ip" placeholder="请输入开发板IP" />
    </div>
    <div>
      <div><small>轮询周期（ms）</small></div>
      <input id="period" value="1000" />
    </div>
    <div style="margin-top:18px;">
      <button id="btnStart">开始监控</button>
      <button id="btnStop" disabled>停止</button>
    </div>
  </div>

  <div class="card">
    <div class="kv">
      <div><span id="dot"></span><span class="k">当前状态</span><span class="v" id="stateText">未连接</span></div>
      <div><span class="k">原始值</span><span class="v" id="stateVal">-</span></div>
      <div><span class="k">温度</span><span class="v" id="tempVal">-</span></div>
      <div><span class="k">湿度</span><span class="v" id="humVal">-</span></div>
      <div><span class="k">电机转速</span><span class="v" id="speedVal">-</span></div>
      <div><span class="k">最近更新时间</span><span class="v" id="ts">-</span></div>
      <div><span class="k">请求URL</span><span class="v" id="url">-</span></div>
    </div>
  </div>

  <div class="card">
    <div style="margin-bottom:8px;"><b>状态曲线（1=工作，0=待机）</b></div>
    <canvas id="chart" width="800" height="240"></canvas>
  </div>

  <div class="card">
    <div style="margin-bottom:8px;"><b>调试日志</b> <small>（仅显示最近50条）</small></div>
    <div id="log"></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const logEl = $("log");
  const dotEl = $("dot");
  const stateTextEl = $("stateText");
  const stateValEl = $("stateVal");
  const tempValEl = $("tempVal");
  const humValEl = $("humVal");
  const speedValEl = $("speedVal");
  const tsEl = $("ts");
  const urlEl = $("url");
  const ipEl = $("ip");
  const periodEl = $("period");
  const btnStart = $("btnStart");
  const btnStop = $("btnStop");
  const canvas = $("chart");
  const ctx = canvas.getContext("2d");

  let timer = null;
  let history = []; // {t:number, v:0/1}
  const MAX_POINTS = 120; // 最近 120 个点

  function sendTime(ip){
    if(!ip) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const ss = String(now.getSeconds()).padStart(2, "0");
    const url = `http://${ip}/time?hh=${hh}&mm=${mm}&ss=${ss}`;
    fetch(url, {cache:"no-store"}).catch(() => {});
  }

  function addLog(line){
    const lines = (logEl.textContent || "").split("\n").filter(Boolean);
    lines.push(line);
    while(lines.length > 50) lines.shift();
    logEl.textContent = lines.join("\n");
    logEl.scrollTop = logEl.scrollHeight;
  }

  function draw(){
    // clear
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // axes
    ctx.beginPath();
    ctx.moveTo(40, 10);
    ctx.lineTo(40, 220);
    ctx.lineTo(790, 220);
    ctx.stroke();

    // y labels
    ctx.fillText("1", 18, 30);
    ctx.fillText("0", 18, 220);

    if(history.length < 2) return;

    const x0 = 40, y0 = 220, w = 750, h = 200;
    const n = history.length;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const x = x0 + (i/(n-1))*w;
      const y = y0 - (history[i].v ? h : 0);
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  async function poll(){
    const ip = ipEl.value.trim();
    if(!ip) return;

    const url = `http://${ip}/data`;
    urlEl.textContent = url;

    try{
      const r = await fetch(url, {cache:"no-store"});
      const raw = (await r.text()).trim();
      let data = null;
      try{
        data = JSON.parse(raw);
      }catch(e){
        throw new Error("返回非JSON");
      }

      const v = (data.state === 1 || data.state === "1") ? 1 : 0;

      const now = new Date();
      tsEl.textContent = now.toLocaleString();

      stateValEl.textContent = String(data.state ?? "-");
      stateTextEl.textContent = v ? "工作模式" : "待机模式";
      dotEl.style.background = v ? "#16a34a" : "#f59e0b";

      const tempText = (typeof data.temp === "number") ? data.temp.toFixed(1) : (data.temp ?? "-");
      const humText = (typeof data.humidity === "number") ? data.humidity.toFixed(1) : (data.humidity ?? "-");
      tempValEl.textContent = `${tempText} °C`;
      humValEl.textContent = `${humText} %`;
      speedValEl.textContent = `${data.speed ?? "-"} %`;

      history.push({t: now.getTime(), v});
      if(history.length > MAX_POINTS) history.shift();
      draw();

      addLog(`[OK] ${now.toLocaleTimeString()}  GET /data -> "${raw}"`);
    }catch(e){
      const now = new Date();
      stateTextEl.textContent = "请求失败";
      dotEl.style.background = "#ef4444";
      tempValEl.textContent = "-";
      humValEl.textContent = "-";
      speedValEl.textContent = "-";
      addLog(`[ERR] ${now.toLocaleTimeString()}  ${e}`);
    }
  }

  function start(){
    const period = Math.max(200, parseInt(periodEl.value || "1000",10));
    if(timer) clearInterval(timer);
    timer = setInterval(poll, period);
    btnStart.disabled = true;
    btnStop.disabled = false;
    sendTime(ipEl.value.trim());
    addLog(`[INFO] 开始轮询，周期=${period}ms`);
    poll();
  }

  function stop(){
    if(timer) clearInterval(timer);
    timer = null;
    btnStart.disabled = false;
    btnStop.disabled = true;
    addLog(`[INFO] 已停止轮询`);
  }

  btnStart.addEventListener("click", start);
  btnStop.addEventListener("click", stop);

  // 初始绘制
  draw();
})();
</script>
</body>
</html>
