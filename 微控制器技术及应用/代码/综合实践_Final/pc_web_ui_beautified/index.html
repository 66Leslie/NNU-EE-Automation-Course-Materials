<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STM32 WiFi 状态监视</title>
  <style>
    :root{
      --bg:#0b1220;
      --bg2:#0f172a;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --muted2: rgba(255,255,255,.52);
      --shadow: 0 16px 50px rgba(0,0,0,.35);
      --radius: 16px;
      --green:#22c55e;
      --amber:#f59e0b;
      --red:#ef4444;
      --blue:#60a5fa;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans";
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background: radial-gradient(900px 520px at 25% -10%, rgba(96,165,250,.22), transparent 55%),
                  radial-gradient(700px 420px at 90% 10%, rgba(34,197,94,.16), transparent 55%),
                  linear-gradient(180deg, var(--bg), var(--bg2));
      min-height:100vh;
    }
    .wrap{max-width:900px;margin:0 auto;padding:26px 16px 34px;}
    h1{margin:0;font-size:20px}
    .sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.4}
    .card{
      margin-top:14px;
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      padding:14px 14px;
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,.03));
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
    .field{flex:1;min-width:220px}
    label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
    input{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
    }
    input:focus{border-color:rgba(96,165,250,.55);background:rgba(255,255,255,.06)}
    button{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(96,165,250,.45);
      background:rgba(96,165,250,.14);
      color:var(--text);
      cursor:pointer;
      font-weight:700;
    }
    button:hover{background:rgba(96,165,250,.20)}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border:1px solid var(--stroke);
      border-radius:999px;background:rgba(255,255,255,.04);
      font-size:12px;color:var(--muted);
      margin-top:10px;
    }
    .pill code{font-family:var(--mono);color:var(--text)}
    .state{
      font-size:22px;font-weight:900;margin-top:8px;
      display:flex;align-items:center;gap:10px;
    }
    .dot{width:10px;height:10px;border-radius:50%;background:#9ca3af;box-shadow:0 0 0 4px rgba(255,255,255,.06)}
    .muted{color:var(--muted);font-size:13px;line-height:1.5}
    .metrics{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    @media (min-width:640px){.metrics{grid-template-columns:repeat(3,1fr)}}
    .metric{
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:12px 12px;
      background:rgba(255,255,255,.04);
      display:flex;align-items:center;gap:12px;
    }
    .k{font-size:12px;color:var(--muted);margin-bottom:6px}
    .v{font-size:16px;font-weight:900}
    .ring{
      width:62px;height:62px;position:relative;flex:0 0 62px;
      display:grid;place-items:center;
    }
    .ring svg{width:62px;height:62px;transform:rotate(-90deg)}
    .ring .bg{stroke: rgba(229,231,235,.18); stroke-width:9; fill:none;}
    .ring .fg{stroke: var(--blue); stroke-width:9; fill:none; stroke-linecap:round; transition: stroke-dashoffset .35s ease;}
    .ring .hole{fill:rgba(0,0,0,.22)}
    .ring .num{position:absolute;font-weight:900;font-size:13px}
    pre{
      font-family:var(--mono);
      font-size:12px;
      color:rgba(255,255,255,.82);
      white-space:pre-wrap;
      word-break:break-word;
      max-height:240px;
      overflow:auto;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.16);
      margin:0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>STM32 WiFi 状态监视（电脑端网页）</h1>
    <div class="sub">保持数据传输逻辑不变：轮询 <code style="font-family:var(--mono);color:var(--text)">/data</code>（JSON: state/temp/humidity/speed），可视化展示温湿度与转速。</div>

    <div class="card">
      <div class="row">
        <div class="field">
          <label for="ip">开发板 IP（例如 192.168.43.123）</label>
          <input id="ip" placeholder="请输入开发板IP" />
        </div>
        <div>
          <button id="btn">开始监视</button>
        </div>
      </div>
      <div class="pill">连接状态：<code id="conn">未连接</code></div>
      <div class="state"><span class="dot" id="stateDot"></span><span id="state">-</span></div>
      <div class="muted">说明：电脑与开发板必须连接同一个热点。网页将每 5 秒访问一次：<code style="font-family:var(--mono);color:var(--text)">http://&lt;IP&gt;/data</code>。</div>

      <div class="metrics">
        <div class="metric">
          <div class="ring" id="tempRing" data-max="50">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="bg" cx="50" cy="50" r="34"></circle>
              <circle class="fg" cx="50" cy="50" r="34"></circle>
              <circle class="hole" cx="50" cy="50" r="24"></circle>
            </svg>
            <div class="num" id="tempNum">--</div>
          </div>
          <div>
            <div class="k">温度</div>
            <div class="v" id="temp">-</div>
          </div>
        </div>
        <div class="metric">
          <div class="ring" id="humRing" data-max="100">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="bg" cx="50" cy="50" r="34"></circle>
              <circle class="fg" cx="50" cy="50" r="34"></circle>
              <circle class="hole" cx="50" cy="50" r="24"></circle>
            </svg>
            <div class="num" id="humNum">--</div>
          </div>
          <div>
            <div class="k">湿度</div>
            <div class="v" id="hum">-</div>
          </div>
        </div>
        <div class="metric">
          <div class="ring" id="speedRing" data-max="100">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="bg" cx="50" cy="50" r="34"></circle>
              <circle class="fg" cx="50" cy="50" r="34"></circle>
              <circle class="hole" cx="50" cy="50" r="24"></circle>
            </svg>
            <div class="num" id="speedNum">--</div>
          </div>
          <div>
            <div class="k">转速</div>
            <div class="v" id="speed">-</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="muted" style="margin-bottom:10px">最近一次返回（JSON / 调试用）</div>
      <pre id="detail">-</pre>
    </div>
  </div>

<script>
  let timer = null;

  function sendTime(ip) {
    if (!ip) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const ss = String(now.getSeconds()).padStart(2, "0");
    const url = `http://${ip}/time?hh=${hh}&mm=${mm}&ss=${ss}`;
    // 数据传输不变：仍然是 GET /time
    fetch(url, { cache: "no-store" }).catch(() => {});
  }

  function clamp(n, lo, hi){
    n = Number(n);
    if(Number.isNaN(n)) return lo;
    return Math.min(hi, Math.max(lo, n));
  }

  function setRing(ringEl, value, max){
    const fg = ringEl.querySelector(".fg");
    const r = 34;
    const circumference = 2 * Math.PI * r;
    fg.style.strokeDasharray = `${circumference} ${circumference}`;
    const p = clamp(value, 0, max) / max;
    fg.style.strokeDashoffset = String(circumference * (1 - p));
  }

  function updateRings(t, h, s){
    const tMax = Number(document.getElementById("tempRing").dataset.max || 50);
    const hMax = Number(document.getElementById("humRing").dataset.max || 100);
    const sMax = Number(document.getElementById("speedRing").dataset.max || 100);

    document.getElementById("tempNum").textContent = Number.isFinite(t) ? t.toFixed(1) : "--";
    document.getElementById("humNum").textContent = Number.isFinite(h) ? h.toFixed(1) : "--";
    document.getElementById("speedNum").textContent = Number.isFinite(s) ? String(Math.round(s)) : "--";

    setRing(document.getElementById("tempRing"), Number.isFinite(t)?t:0, tMax);
    setRing(document.getElementById("humRing"), Number.isFinite(h)?h:0, hMax);
    setRing(document.getElementById("speedRing"), Number.isFinite(s)?s:0, sMax);
  }

  async function poll(ip) {
    const url = `http://${ip}/data`;
    try {
      // 数据传输不变：仍然是 GET /data 并解析 JSON
      const r = await fetch(url, { cache: "no-store" });
      const raw = (await r.text()).trim();
      let data = null;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        throw new Error("返回非JSON");
      }

      const stateVal = (data.state === 1 || data.state === "1") ? 1 : 0;
      document.getElementById("conn").textContent = "已连接";

      document.getElementById("state").textContent = stateVal ? "工作模式" : "待机模式";
      document.getElementById("stateDot").style.background = stateVal ? "var(--green)" : "var(--amber)";

      const tempText = (typeof data.temp === "number") ? data.temp.toFixed(1) : (data.temp ?? "-");
      const humText = (typeof data.humidity === "number") ? data.humidity.toFixed(1) : (data.humidity ?? "-");

      document.getElementById("temp").textContent = `${tempText} °C`;
      document.getElementById("hum").textContent = `${humText} %`;
      document.getElementById("speed").textContent = `${data.speed ?? "-"} %`;

      const tNum = (typeof data.temp === "number") ? data.temp : parseFloat(String(data.temp));
      const hNum = (typeof data.humidity === "number") ? data.humidity : parseFloat(String(data.humidity));
      const sNum = (typeof data.speed === "number") ? data.speed : parseFloat(String(data.speed));
      updateRings(
        Number.isFinite(tNum) ? tNum : NaN,
        Number.isFinite(hNum) ? hNum : NaN,
        Number.isFinite(sNum) ? sNum : NaN
      );

      document.getElementById("detail").textContent = raw;
    } catch (e) {
      document.getElementById("conn").textContent = "请求失败";
      document.getElementById("state").textContent = "-";
      document.getElementById("temp").textContent = "-";
      document.getElementById("hum").textContent = "-";
      document.getElementById("speed").textContent = "-";
      document.getElementById("stateDot").style.background = "var(--red)";
      updateRings(NaN, NaN, NaN);
      document.getElementById("detail").textContent = String(e);
    }
  }

  document.getElementById("btn").addEventListener("click", () => {
    const ip = document.getElementById("ip").value.trim();
    if (!ip) return;

    // 同步时间（可选）
    sendTime(ip);

    if (timer) clearInterval(timer);
    timer = setInterval(() => poll(ip), 5000);
    poll(ip);
  });

  // 初始状态
  updateRings(NaN, NaN, NaN);
</script>
</body>
</html>
